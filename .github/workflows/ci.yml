name: Integration scaffold
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff==0.11.13
      - run: ruff check .
      - name: Unit and data format tests
        env:
          PYTHONPATH: ros2_ws/src/auv_diagnostics
        run: python -m unittest discover -s ros2_ws/src/auv_diagnostics/test -v
  ros2:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t auv-week1 .
      - name: ROS2 package tests
        run: >-
          docker run --rm auv-week1 bash -c
          'cd /workspace/ros2_ws && colcon test --return-code-on-test-failure && colcon test-result --all --verbose'
      - name: Four-node smoke test
        run: docker run --rm --mount type=bind,source="$PWD",target=/host auv-week1 python3 /workspace/scripts/check_ros_demo.py --output-root /host/artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-reports
          path: artifacts/
